components:
  schemas:
    OperationalError:
      description: Stable error code and request identifier.
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - request_id
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
            details:
              type: object
    Session:
      type: object
      properties:
        authenticated:
          type: boolean
        csrf_token:
          type: string
      required:
      - authenticated
      - csrf_token
    Login:
      type: object
      properties:
        password:
          type: string
      required:
      - password
      additionalProperties: false
    Job:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
        state:
          type: string
        phase:
          type: string
        volume_id:
          type: string
        options: {}
        state_version:
          type: integer
        created_at:
          type: string
        completed_at:
          type: string
        error_code:
          type: string
    Volume:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
        label:
          type: string
        location:
          type: string
        barcode:
          type: string
          maxLength: 128
          description: Optional manual catalog metadata, never used as tape identity.
        generation:
          type: string
        state:
          type: string
        header_sha256:
          type: string
        created_at:
          type: string
    Drive:
      type: object
      properties:
        id:
          type: string
        mode:
          type: string
        status:
          type: string
        cartridge_id:
          type: string
        capacity_bytes:
          type: integer
        used_bytes:
          type: integer
        write_protected:
          type: boolean
        uncertain:
          type: boolean
    Archive:
      $ref: ../schemas/archive-response.json
    Member:
      type: object
      properties:
        id:
          type: integer
        path:
          type: string
        raw_path:
          type: string
        parent_path:
          type: string
        type:
          type: string
        size:
          type: integer
        mtime:
          type: string
        mode:
          type: integer
        link_target:
          type: string
        archive_id:
          type: string
        volume_id:
          type: string
        volume_label:
          type: string
        data_file_index:
          type: integer
        integrity:
          type: string
        integrity_basis:
          type: string
    Profile:
      type: object
      properties:
        id:
          type: string
        name: &id001
          type: string
        source_id: &id002
          type: string
        relative_selection: &id003
          type: string
        exclusions: &id004
          type: array
          items:
            type: string
        target_volume_id: &id005
          type: string
        enabled: &id006
          type: boolean
        revision: &id007
          type: integer
        updated_at:
          type: string
      required:
      - name
      - source_id
      - target_volume_id
    Schedule:
      type: object
      properties:
        id:
          type: string
        profile_id: &id008
          type: string
        operation:
          type: string
          enum: [BACKUP, VERIFY]
          default: BACKUP
          description: VERIFY rereads the profile target without source access or write enrollment.
        cadence: &id009
          type: string
        timezone: &id010
          type: string
        local_time: &id011
          type: string
        weekday: &id012
          type: integer
        enabled: &id013
          type: boolean
        revision: &id014
          type: integer
        updated_at:
          type: string
      required:
      - profile_id
      - cadence
      - timezone
      - local_time
    RestoreSelection:
      type: object
      properties:
        archive_id:
          type: string
        member_ids:
          type: array
          items:
            type: integer
        all:
          type: boolean
        restore_root_id:
          type: string
        destination_slug:
          type: string
        legacy_source_id:
          type: string
        legacy_profile:
          type: string
        legacy_confirmation:
          type: boolean
      required:
      - archive_id
      - restore_root_id
      - destination_slug
      additionalProperties: false
    RestorePlan:
      type: object
      properties:
        id:
          type: string
        archive_id:
          type: string
        volume_id:
          type: string
        restore_root_id:
          type: string
        destination_slug:
          type: string
        selected_members:
          type: integer
        expanded_members:
          type: integer
        requested_members:
          type: integer
        output_bytes:
          type: integer
        spool_bytes:
          type: integer
        members: {}
        truncated:
          type: boolean
        expires_at:
          type: string
        metadata_policy:
          type: string
        integrity_basis:
          type: string
    BackupPlan:
      type: object
      properties:
        id:
          type: string
        revision:
          type: integer
        entries:
          type: integer
        logical_bytes:
          type: integer
        estimated_bytes:
          type: integer
        volume_id:
          type: string
        expires_at:
          type: string
        sparse_files:
          type: integer
    Run:
      type: object
      properties:
        plan_id:
          type: string
        revision:
          type: integer
      required:
      - plan_id
      additionalProperties: false
    Event:
      type: object
      properties:
        id:
          type: integer
        job_id:
          type: string
        timestamp:
          type: string
        code:
          type: string
        message:
          type: string
    Export:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
        filename:
          type: string
        volume_id:
          type: string
        bytes:
          type: integer
        sha256:
          type: string
        expires_at:
          type: string
        created_at:
          type: string
    Info:
      type: object
      properties:
        mode:
          type: string
        physical_writes_enabled:
          type: boolean
        qualified_profiles:
          type: integer
        restore_roots:
          type: array
          items:
            type: string
        legacy_roots:
          type: array
          items:
            type: string
    Import:
      type: object
      properties:
        mode:
          type: string
        expected_volume_id:
          type: string
        source_id:
          type: string
        profile:
          type: string
        label:
          type: string
        volume_id:
          type: string
        confirmed:
          type: boolean
      required:
      - mode
      additionalProperties: false
    Notification:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
        job_id:
          type: string
        created_at:
          type: string
        read_at:
          type:
          - string
          - 'null'
        message:
          type: string
    Audit:
      type: object
      properties:
        id:
          type: integer
        actor:
          type: string
        action:
          type: string
        object:
          type: string
        created_at:
          type: string
    Simple:
      type: object
      properties: {}
    Source:
      type: object
      properties:
        id:
          type: string
    Child:
      type: object
      properties:
        name:
          type: string
        directory:
          type: boolean
    OriginVolume:
      type: object
      properties:
        label:
          type: string
        location:
          type: string
        barcode:
          type: string
          maxLength: 128
          description: Optional manual catalog metadata, never used as tape identity.
      required:
      - label
      additionalProperties: false
    EditInventory:
      type: object
      properties:
        label:
          type: string
        location:
          type: string
        barcode:
          type: string
          maxLength: 128
          description: Optional manual catalog metadata, never used as tape identity.
        previous_label:
          type: string
        previous_location:
          type: string
        previous_barcode:
          type: string
          maxLength: 128
      required:
      - label
      - previous_label
      dependentRequired:
        barcode: [previous_barcode]
      additionalProperties: false
    Insert:
      type: object
      properties:
        cartridge_id:
          type: string
      required:
      - cartridge_id
      additionalProperties: false
    Revision:
      type: object
      properties:
        revision:
          type: integer
      additionalProperties: false
    ExportRequest:
      type: object
      properties:
        kind:
          type: string
        volume_id:
          type: string
      required:
      - kind
      additionalProperties: false
    ProfilePatch:
      type: object
      properties:
        name: *id001
        source_id: *id002
        relative_selection: *id003
        exclusions: *id004
        target_volume_id: *id005
        enabled: *id006
        revision: *id007
      required:
      - revision
      additionalProperties: false
    SchedulePatch:
      type: object
      properties:
        profile_id: *id008
        operation:
          type: string
          enum: [BACKUP, VERIFY]
          description: VERIFY rereads the profile target without source access or write enrollment.
        cadence: *id009
        timezone: *id010
        local_time: *id011
        weekday: *id012
        enabled: *id013
        revision: *id014
      required:
      - revision
      additionalProperties: false
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: tapepilot_session
      description: HTTPS uses the __Host-tapepilot_session cookie. Explicit loopback
        HTTP uses tapepilot_session.
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
