openapi: 3.1.0
info:
  title: TapePilot simulator API
  version: 0.1.0-development
paths:
  /api/v1/health:
    get:
      operationId: health
      responses:
        '200':
          description: Simulator backend is reachable
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - status
                - mode
                properties:
                  status:
                    const: ok
                  mode:
                    const: simulator
  /api/v1/auth/session:
    get:
      summary: Get current or anonymous CSRF session
      operationId: getAuthSession
      security: []
      responses:
        '200':
          description: Get current or anonymous CSRF session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default:
          description: Request refused or operation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalError'
  /api/v1/auth/login:
    post:
      summary: Authenticate and rotate session
